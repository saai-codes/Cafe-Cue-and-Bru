<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE08B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#0B111E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Coffee Cup Base -->
  <path d="M42 62 C42 75 48 82 60 82 C72 82 78 75 78 62 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M78 66 C85 66 88 71 85 75 C82 78 76 77 75 76" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Cue Stick intersecting behind -->
  <line x1="28" y1="92" x2="92" y2="28" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="30" y1="90" x2="35" y2="85" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />

  <!-- Snooker 8-Ball -->
  <circle cx="45" cy="46" r="10" fill="#0B111E" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="45" cy="46" r="4.5" fill="#FAF6F0" />
  <text x="45" y="48.5" font-family="'Cinzel', serif, sans-serif" font-size="5.5" font-weight="900" fill="#0B111E" text-anchor="middle">8</text>

  <!-- Coffee Aroma Steam Spirals -->
  <path d="M56 54 C54 49 59 44 57 39" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  <path d="M64 53 C62 48 67 43 65 38" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Subtle star sparkle -->
  <polygon points="76,38 78,42 82,44 78,46 76,50 74,46 70,44 74,42" fill="url(#goldGrad)" />
</svg>
